<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- волны звона -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="14" opacity="0.55">
    <path d="M92 190 Q70 256 92 322"/>
    <path d="M420 190 Q442 256 420 322"/>
  </g>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="10" opacity="0.3">
    <path d="M54 160 Q22 256 54 352"/>
    <path d="M458 160 Q490 256 458 352"/>
  </g>
  <!-- колокольчик -->
  <g filter="url(#sh)">
    <circle cx="256" cy="98" r="24" fill="url(#bell)"/>
    <path d="M256 112 C170 112 140 190 140 262 C140 318 118 346 98 372 C90 384 98 398 112 398 L400 398 C414 398 422 384 414 372 C394 346 372 318 372 262 C372 190 342 112 256 112 Z" fill="url(#bell)"/>
    <path d="M214 410 a42 42 0 0 0 84 0 Z" fill="#c7d2fe"/>
  </g>
  <!-- циферблат на колокольчике -->
  <circle cx="256" cy="268" r="64" fill="#4f46e5"/>
  <circle cx="256" cy="268" r="64" fill="none" stroke="#a5b4fc" stroke-width="6"/>
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M256 268 V226"/>
    <path d="M256 268 L286 286"/>
  </g>
  <circle cx="256" cy="268" r="7" fill="#fbbf24"/>
  <!-- красная точка уведомления -->
  <circle cx="368" cy="148" r="34" fill="#fbbf24" stroke="#7c3aed" stroke-width="10"/>
</svg>
